{% extends 'base.html' %}
{% block title %}Booking Confirmed!{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-16 text-center">
    <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100 flex flex-col items-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        
        <h1 class="text-3xl font-black text-gray-900 mb-2">Booking Confirmed!</h1>
        <p class="text-gray-500 text-sm mb-6">Your room allocation setup status is complete.</p>

        <div class="flex gap-4 w-full mt-4">
            <a href="{% url 'view_bill' booking.id %}" class="flex-1 bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700 transition">
                View Bill
            </a>
            <a href="{% url 'user_dashboard' %}" class="flex-1 bg-gray-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-gray-800 transition">
                My Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
