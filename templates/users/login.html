{% extends 'base.html' %}
{% block title %}Login - StayEase{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-6 text-center">Welcome Back</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-xl hover:bg-red-600 transition">Log In</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">Don't have an account? <a href="{% url 'register' %}" class="text-primary hover:underline font-bold">Sign up</a></p>
    </div>
</div>
{% endblock %}
