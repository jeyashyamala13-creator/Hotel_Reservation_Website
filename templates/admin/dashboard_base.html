{% extends 'base.html' %}

{% block content %}
<div class="flex h-screen bg-gray-50 overflow-hidden">
    <aside class="w-20 md:w-64 bg-gray-900 text-white flex flex-col shadow-2xl z-20 transition-all duration-300 flex-shrink-0">
        
        <div class="p-4 md:p-6 border-b border-gray-800 flex justify-center md:justify-start">
            <div class="hidden md:block">
                <h2 class="text-2xl font-black text-white tracking-tight">StayEase<span class="text-red-500">.</span></h2>
                <p class="text-xs text-gray-400 font-bold mt-1 uppercase tracking-wider">Admin Engine</p>
            </div>
            <div class="md:hidden">
                <h2 class="text-2xl font-black text-white tracking-tight">S<span class="text-red-500">.</span></h2>
            </div>
        </div>

        <nav class="flex-1 px-2 md:px-4 py-6 space-y-2">
            <a href="{% url 'custom_admin_dashboard' %}" title="Dashboard Overview" class="flex items-center justify-center md:justify-start md:space-x-3 px-3 md:px-4 py-3 rounded-xl transition {% if active_tab == 'dashboard' %}bg-red-600 text-white shadow-lg{% else %}text-gray-300 hover:bg-gray-800{% endif %}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path></svg>
                <span class="hidden md:inline font-bold text-sm">Dashboard Overview</span>
            </a>
            
            <a href="{% url 'admin_manage_rooms' %}" title="Manage Rooms" class="flex items-center justify-center md:justify-start md:space-x-3 px-3 md:px-4 py-3 rounded-xl transition {% if active_tab == 'rooms' %}bg-red-600 text-white shadow-lg{% else %}text-gray-300 hover:bg-gray-800{% endif %}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="hidden md:inline font-bold text-sm">Manage Rooms</span>
            </a>
            
            <a href="{% url 'admin_manage_categories' %}" title="Category & Pricing" class="flex items-center justify-center md:justify-start md:space-x-3 px-3 md:px-4 py-3 rounded-xl transition {% if active_tab == 'categories' %}bg-red-600 text-white shadow-lg{% else %}text-gray-300 hover:bg-gray-800{% endif %}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="hidden md:inline font-bold text-sm">Category & Pricing</span>
            </a>
            
            <a href="{% url 'admin_revenue_reports' %}" title="Revenue Reports" class="flex items-center justify-center md:justify-start md:space-x-3 px-3 md:px-4 py-3 rounded-xl transition {% if active_tab == 'reports' %}bg-red-600 text-white shadow-lg{% else %}text-gray-300 hover:bg-gray-800{% endif %}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="hidden md:inline font-bold text-sm">Revenue Reports</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800">
            <a href="{% url 'hotel_list' %}" title="Main Site" class="flex items-center justify-center w-full bg-gray-800 hover:bg-gray-700 text-white text-xs font-bold py-3 rounded-xl transition">
                <span class="md:hidden text-lg">←</span>
                <span class="hidden md:inline">← Main Site</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden bg-gray-50">
        <header class="bg-white px-4 md:px-8 py-5 flex items-center justify-between border-b border-gray-100 sticky top-0 z-10">
            <h1 class="text-lg md:text-xl font-black text-gray-900 tracking-tight uppercase truncate mr-2">
                {% block admin_title %}{% endblock %}
            </h1>
            <span class="text-xs font-bold text-gray-500 bg-gray-100 px-2 md:px-3 py-1.5 rounded-lg whitespace-nowrap">
                <span class="hidden md:inline">SYSTEM OPERATOR: </span>{{ user.username }}
            </span>
        </header>
        <div class="p-4 md:p-8">
            {% block admin_content %}{% endblock %}
        </div>
    </main>
</div>
{% endblock %}
